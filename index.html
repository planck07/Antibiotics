<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font:500 30px/1.15 Fraunces,Georgia,serif;margin:0 0 10px}
p{margin:0 0 14px}
.mute{color:var(--mute);font-size:15px}
button{font:600 17px "Source Sans 3",system-ui,sans-serif;min-height:48px;padding:0 20px;border-radius:8px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;width:100%}
button.opt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);text-align:left;margin:0 0 10px;padding:12px 16px;font-weight:400;height:auto;user-select:none}
button.opt.sel{border-color:var(--teal);background:var(--tealbg)}
button.alt{background:var(--card);color:var(--teal)}

input{width:100%;min-height:48px;padding:0 14px;font:400 17px "Source Sans 3",system-ui,sans-serif;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:0 0 14px}
.err{color:var(--bad);font-size:15px;min-height:22px;margin:4px 0 10px}
.top{display:flex;justify-content:space-between;font-size:15px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 22px}
.bar i{display:block;height:5px;background:var(--teal);border-radius:3px}
.q{font:500 22px/1.3 Fraunces,Georgia,serif;margin:0 0 18px;user-select:none}
.row{display:flex;gap:10px;margin:0 0 12px}.row button{flex:1}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 16px}
button.qn{padding:0;min-height:46px;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button.qn.done{background:var(--teal);color:#fff;border-color:var(--teal)}
button.qn.cur{box-shadow:0 0 0 3px var(--ink)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.rv .rq{font-weight:600;margin:0 0 8px}
.rv p{margin:0 0 6px;font-size:16px}
.no{color:var(--bad)}.yes{color:var(--good)}
.code{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;word-break:break-word;margin:0 0 14px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>

ia causes gonorrhea, E. coli causes UTI, and Corynebacteria are linked to endocarditis."], ["A gram-negative coccus that causes gonorrhea is:", ["Neisseria", "E. coli", "Corynebacteria", "Staphylococcus"], 0, "Staphylococcus is a gram-positive coccus linked to toxic shock syndrome."], ["Which classes of antibiotics work by blocking protein formation?", ["Nalidixic acid", "Macrolides, tetracyclines and aminoglycosides", "Penicillins and cephalosporins", "Sulfonamides"], 1, "Penicillins and cephalosporins inhibit cell wall formation, sulfonamides prevent folic acid synthesis, and nalidixic acid interferes with DNA."], ["Sulfonamides act by:", ["Blocking protein synthesis", "Altering bacterial DNA", "Inhibiting cell wall formation", "Preventing folic acid synthesis"], 3, "Folic acid is needed to make purines and nucleic acids, so sulfonamides are bacteriostatic."], ["Why don't sulfonamides harm human cells?", ["Humans don't need folic acid", "They can't enter human cells", "Human cells use preformed folic acid", "They are inactive in humans"], 2, "Humans, and some bacteria, can use preformed folic acid, so blocking its synthesis doesn't affect them."], ["Roughly what proportion of patients seeking optometric services have a pathological condition needing referral?", ["About ten percent", "About half", "About a quarter", "About one percent"], 3, "The first procedure, ophthalmoscopy, is done to find or exclude pathology."], ["Co-trimoxazole (Bactrim) contains:", ["Trimethoprim plus sulfamethoxazole", "Ampicillin plus sulbactam", "Sulfisoxazole plus erythromycin", "Amoxicillin plus clavulanic acid"], 0, "It is used for UTIs, Pneumocystis pneumonia, ear infections and bronchitis, among others."], ["Pediazole combines sulfisoxazole with erythromycin and is used to treat:", ["Acne", "Urinary tract infection", "Syphilis", "Otitis media"], 3, "Azo-Gantrisin, which combines sulfisoxazole with phenazopyridine, is used for UTIs."], ["Which is a side effect of sulfonamides?", ["Ot em"], 1, "Fourth-generation agents are broad in spectrum, including gram-positive bacteria."], ["Cefixime (Suprax) is notable because it is:", ["The only oral third-generation cephalosporin", "A penicillin", "A first-generation drug", "An IV-only agent"], 0, "It is the best of the oral cephalosporins against gram-negative bacteria."], ["Ceftriaxone is useful for CNS infections because it:", ["Is excreted only by the biliary route", "Is taken only orally", "Has a short half-life", "Easily passes the meninges and diffuses into CSF"], 3, "It also has a long half-life, allowing once-a-day dosing."], ["Which cephalosporin is used for difficult-to-treat organisms such as Pseudomonas?", ["Ceftazidime", "Cephalexin", "Cefazolin", "Cefadroxil"], 0, "Ceftazidime has excellent gram-negative coverage and is eliminated by the kidneys."], ["A patient allergic to penicillin is prescribed a cephalosporin. Why should the pharmacist be alerted?", ["Chelation", "Cross-allergy", "Photosensitivity", "Theophylline interaction"], 1, "Cephalosporins are structurally and pharmacologically related to penicillins."], ["For the gross cylinder of −1.00 × 5, Javal's rule gives a net cylinder of:", ["−0.25 × 5", "−1.25 × 5", "−0.75 × 5", "−0.50 × 90"], 2, "Add one-fourth of the gross cylinder (−0.25) for the distance factor to get −1.25 × 5, then allow for physiological astigmatism of −0.50 × 90 to get −0.75 × 5."], ["Some cephalosporins may cause an Antabuse-like reaction with:", ["Alcohol", "Dairy products", "Antacids", "Sunlight"], 0, "Patients should avoid alcohol while taking them."], ["Tetracyclines are:", ["Bacteriostatic inhibitors of protein synthesis", "Folic acid blockers", "Bactericidal inhibitors of cell wall synthesis", "Bactericidal DNA inhibitors"], 0, "They stop many essential functions of the bacteria by blocking protein synthesis."], ["Why should tetracyclines not be taken with milk, antacids or iron?", ["They bind calcium, magnesium, aluminium and iron to form insoluble complexes, reducing absorption", "They increase absorption", "They become toxic", "They cause photosensitivity"], 0, "This is chelation, and it stops the drug being absorbed."], ["Tetracyclines are avoided in pregnancy and in children because they:", ["Discolour teeth and may retard fetal skeletal development", "Cause ototoxicity", "Cause crystalluria", "Block folic acid synthesis"], 0, "They have a strong affinity for calcium."], ["Demeclocycline, a tetracycline, is also used to treat:", ["Diabetes insipidus", "SIADH", "Acromegaly", "Graves' disease"], 1, "It is also used for pleural and pericardial effusions."], ["In a phoria test, base-in prism remaining at the end point of vertical alignment is recorded as:", ["Orthophoria", "Esophoria", "Hyperphoria", "Exophoria"], 3, "Base-out remaining is esophoria, and zero is orthophoria."], ["Aminoglycosides are given by injection because:", ["They are poorly absorbed orally", "They are lipid-soluble", "They are inactive in blood", "They are destroyed by light"], 0, "There are no oral forms."], ["The two most important toxicities of aminoglycosides are:", ["Hepatotoxicity and jaundice", "Tooth discoloration and superinfection", "Photosensitivity and hemolysis", "Nephrotoxicity and ototoxicity"], 3, "Ototoxicity affects the eighth cranial nerve, and drug levels must be monitored."], ["Peak and trough blood levels are monitored for which class?", ["Tetracyclines", "Penicillins", "Sulfonamides", "Aminoglycosides"], 3, "Monitoring helps prevent nephrotoxicity and ototoxicity."], ["Quinolones kill bacteria by:", ["Preventing folic acid synthesis", "Blocking protein synthesis", "Blocking cell wall synthesis", "Altering bacterial DNA"], 3, "They don't affect human DNA."], ["Taking a quinolone together with an antacid will:", ["Convert it to its active form", "Reduce its absorption", "Increase its absorption", "Cause hepatotoxicity"], 1, "Antacids interfere with absorption of quinolones."], ["In static retinoscopy with a 20-inch working function hs(t){var x=5381;for(var k=0;k<t.length;k++){x=((x<<5)+x+t.charCodeAt(k))>>>0;}return x;}
function shuffle(a){for(var x=a.length-1;x>0;x--){var j=Math.floor(Math.random()*(x+1)),t=a[x];a[x]=a[j];a[j]=t;}return a;}
function sget(){try{return JSON.parse(localStorage.getItem(SK));}catch(e){return null;}}
function sset(v){try{localStorage.setItem(SK,JSON.stringify(v));}catch(e){}}
function p2(n){return String(n).padStart(2,"0");}
function mmss(ms){var s=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(s/60))+":"+p2(s%60);}
function gate(){
 var s=sget();
 if(s&&s.done){showResult(s,false);return;}

 app.innerHTML='<h1>Antibiotics and OEP steps quiz</h1><p class="mute">Antibiotics, with OEP steps 1 to 6</p><p>'+Q.length+' multiple-choice questions, '+(LIMIT/60)+' minutes. One attempt. You can go back and change answers before you submit, and afterwards you will see all your answers, right and wrong, with explanations for the ones you missed.</p><label for="nm" class="mute">Your full name</label><input id="nm" autocomplete="name" placeholder="Ama Mensah"><label for="pw" class="mute">Access code from your instructor</label><input id="pw" type="password" autocomplete="off"><div class="err" id="err" role="alert"></div><button id="go">Start quiz</button>';

  if(hs(document.getElementById("pw").value.trim().toLowerCase())!==CH){err.textContent="That access code isn't right. Check it and try again.";return;}
  begin(name);
 };
}
function begin(name){
 var idx=[];for(var k=0;k<Q.length;k++){idx.push(k);}
 order=shuffle(idx).map(function(n){var o=Q[n][1].map(function(t,j){return {t:t,o:j};});return {n:n,q:Q[n][0],opts:shuffle(o)};});
 picks=[];for(var z=0;z<Q.length;z++){picks.push(-1);}

function head(){

}

 for(var k=0;k<d.opts.length;k++){h+='<button class="opt'+(picks[i]===k?' sel':'')+'" data-k="'+k+'">'+d.opts[k].t+'</button>';}

 var o=app.querySelectorAll(".opt");

 var bk=document.getElementById("bk");if(bk){bk.onclick=function(){i--;ask();};}

 var score=0,rev=[],answered=0;

 }
 rev.sort(function(a,b){return a[0]-b[0];});
 var used=mmss(Math.min(Date.now(),end)-t0);

}

  var h='<h1>You scored '+s.score+' / '+s.total+'</h1><p class="mute" id="st">'+(fresh?statusMsg:"Your result was already submitted on this device.")+'</p>';
  h+='<h2 style="font:500 22px Fraunces,Georgia,serif;margin:18px 0 6px">Your answers</h2><p class="mute">'+s.score+' correct, '+wrong+' wrong or unanswered. Correct answers are marked. Each wrong one shows the right answer and why.</p><div class="row"><button id="fa" class="'+(only?'alt':'')+'">All questions</button><button id="fw" class="'+(only?'':'alt')+'">Wrong only</button></div>';
  for(var k=0;k<r.length;k++){
   if(only&&r[k][5]){continue;}
   if(r[k][5]){h+='<div class="rv"><p class="rq">'+r[k][1]+'</p><p class="yes"><b>Correct:</b> '+r[k][3]+'</p></div>';}
   else{h+='<div class="rv"><p class="rq">'+r[k][1]+'</p><p class="no">Your answer: '+r[k][2]+'</p><p class="yes">Correct answer: '+r[k][3]+'</p><p><b>Why:</b> '+r[k][4]+'</p></div>';}
  }
  h+='<p>Your result code:</p><div class="code">'+s.code+'</div><button id="cp" class="alt">Copy result code</button><div class="err" id="cerr"></div><a class="btn" href="quit.html">Exit exam</a>';
  app.innerHTML=h;
  document.getElementById("fa").onclick=function(){only=false;draw();};
  document.getElementById("fw").onclick=function(){only=true;draw();};
  document.getElementById("cp").onclick=function(){var m=document.getElementById("cerr");try{navigator.clipboard.writeText(s.code).then(function(){m.textContent="Copied.";},function(){m.textContent="Select the code above and copy it.";});}catch(e){m.textContent="Select the code above and copy it.";}};
 }
 draw();window.scrollTo(0,0);
}
document.addEventListener("visibilitychange",function(){if(active&&document.hidden){sw++;}});
document.addEventListener("contextmenu",function(e){if(active){e.preventDefault();}});
document.addEventListener("copy",function(e){if(active){e.preventDefault();}});
gate();
</script>
